[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "modbot"
version = "0.2.1"
description = "discord mod bot and audit logger"
authors = [
    { name = "Alex", email = "alex@local" }
]
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.3.0",
    "aiosqlite>=0.19.0",
    "prometheus-client>=0.19.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
modbot = "modbot.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
